[package]
name = "rtsyn"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
rtsyn-ui = { git = "https://github.com/seregioo/rtsyn-ui.git", features = ["embedded-daemon"] }

[build-dependencies]
cc = "1"

[lib]
name = "rtsyn"
path = "src/lib.rs"

[[bin]]
name = "rtsyn"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
